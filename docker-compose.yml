version: "3.9"

services:
  app:
    build: .
    ports:
      # Keep this restricted to the host or LAN interface you actually want to expose.
      # Example for local-only access: 127.0.0.1:8000:8000
      # Example for a LAN device on 192.168.1.50: 192.168.1.50:8000:8000
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - FETCH_CRON=0 4 * * 3
      - SCHEDULER_TIMEZONE=Pacific/Auckland
      - DATABASE_FILE=/app/data/data.db
    volumes:
      - ./data:/app/data
